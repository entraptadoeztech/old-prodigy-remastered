<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prodigy!</title>
<!-- Version 3: hosted the libcurl files on jsDelivr (project made by entraptadoeztech) -->
</head>

<body>

<script src="https://cdn.jsdelivr.net/gh/entraptadoeztech/old-prodigy-remastered@c3ea8ab7075ee8b780d0855dd61159de57a97478/src/assets/libcurl.js"></script>

<script>
(async () => {

    const PROD = "https://oldprodigy.onrender.com/play/index.html";
    const PROD_BASE = new URL(PROD);
    const PROD_ORIGIN = PROD_BASE.origin;
    const PROXY_HOSTS = new Set([
        PROD_BASE.hostname
    ]);

    try {
        history.replaceState(null, "", "/");
    } catch (_) {}

    await libcurl.load_wasm(
        "https://cdn.jsdelivr.net/npm/libcurl.js@0.7.1/libcurl.wasm"
    );

    libcurl.transport = "wisp";

    libcurl.set_websocket(
        "wss://wisp.mercurywork.shop/"
    );

    const nativeFetch = window.fetch.bind(window);

    async function curlFetch(url, options = {}) {

        const requestURL =
            typeof url === "string"
                ? url
                : url.url;

        console.log(
            "[WISP FETCH]",
            requestURL
        );

        const result =
            await libcurl.fetch(
                requestURL,
                {
                    method:
                        options.method || "GET",

                    headers:
                        options.headers || {},

                    body:
                        options.body
                }
            );

        const body =
            await result.arrayBuffer();

        return new Response(
            body,
            {
                status:
                    result.status,

                statusText:
                    result.statusText,

                headers:
                    result.headers
            }
        );
    }

    window.fetch = async function(
        input,
        options = {}
    ) {

        const request =
            input instanceof Request
                ? input
                : null;

        const url =
            request
                ? request.url
                : typeof input === "string"
                    ? input
                    : input.url;

        try {

            const parsed =
                new URL(
                    url,
                    location.href
                );

            if (
                PROXY_HOSTS.has(parsed.hostname) ||
                parsed.hostname.endsWith(".github.io")
            ) {

                const requestOptions = {
                    ...options
                };

                if (request) {
                    requestOptions.method ||= request.method;
                    requestOptions.headers ||= Object.fromEntries(request.headers);

                    if (
                        request.method !== "GET" &&
                        request.method !== "HEAD" &&
                        requestOptions.body === undefined
                    ) {
                        requestOptions.body = await request.clone().arrayBuffer();
                    }
                }

                return await curlFetch(
                    parsed.href,
                    requestOptions
                );
            }

        } catch (_) {}

        return nativeFetch(
            input,
            options
        );
    };

    const response =
        await libcurl.fetch(
            PROD_BASE.href
        );

    if (!response.ok) {
        throw new Error(
            "Prodigy returned HTTP " +
            response.status
        );
    }

    const html =
        await response.text();

    console.log(
        "Prodigy HTML:",
        html.length,
        "bytes"
    );

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );

    function fixURL(value) {

        if (!value) {
            return value;
        }

        value = value.trim();

        if (
            value.startsWith("data:") ||
            value.startsWith("blob:") ||
            value.startsWith("javascript:") ||
            value.startsWith("mailto:") ||
            value.startsWith("#")
        ) {
            return value;
        }

        try {

            if (value.startsWith("//")) {
                return "https:" + value;
            }

            return new URL(
                value,
                PROD_BASE
            ).href;

        } catch (_) {

            return value;
        }
    }

    const attributes = [
        "src",
        "href",
        "poster",
        "action",
        "formaction",
        "cite",
        "background",
        "data-src",
        "data-href",
        "data-url"
    ];

    for (const attribute of attributes) {

        for (const element of
            doc.querySelectorAll(
                "[" + attribute + "]"
            )) {

            const value =
                element.getAttribute(
                    attribute
                );

            if (!value) {
                continue;
            }

            element.setAttribute(
                attribute,
                fixURL(value)
            );
        }
    }

    for (const element of
        doc.querySelectorAll("[srcset]")) {

        const value =
            element.getAttribute(
                "srcset"
            );

        if (!value) {
            continue;
        }

        const rewritten =
            value
                .split(",")
                .map(item => {

                    const parts =
                        item.trim()
                            .split(/\s+/);

                    if (!parts.length) {
                        return item;
                    }

                    parts[0] =
                        fixURL(parts[0]);

                    return parts.join(" ");
                })
                .join(", ");

        element.setAttribute(
            "srcset",
            rewritten
        );
    }

    for (const element of
        doc.querySelectorAll("[style]")) {

        let style =
            element.getAttribute(
                "style"
            );

        style =
            style.replace(
                /url\(\s*(['"]?)([^'")]+)\1\s*\)/gi,
                (match, quote, url) => {

                    return (
                        "url(" +
                        quote +
                        fixURL(url) +
                        quote +
                        ")"
                    );
                }
            );

        element.setAttribute(
            "style",
            style
        );
    }

    for (const script of
        doc.querySelectorAll("script")) {

        if (!script.textContent) {
            continue;
        }

        let code =
            script.textContent;

        code =
            code.replace(
                /(["'`])\/(?!\/)([^"'`\r\n]*)\1/g,
                (match, quote, path) => {

                    return (
                        quote +
                        fixURL("/" + path) +
                        quote
                    );
                }
            );

        code =
            code.replace(
                /(["'`])\/\/([^"'`\r\n]+)\1/g,
                (match, quote, host) => {

                    return (
                        quote +
                        "https://" +
                        host +
                        quote
                    );
                }
            );

        script.textContent =
            code;
    }

    for (const base of
        doc.querySelectorAll("base")) {

        base.remove();
    }

    const output =
        "<!DOCTYPE html>\n" +
        doc.documentElement.outerHTML;

    console.log(
        "Rewritten Prodigy HTML:",
        output.length,
        "bytes"
    );

    document.open();

    document.write(output);

    document.close();

})();
</script>

</body>
</html>
