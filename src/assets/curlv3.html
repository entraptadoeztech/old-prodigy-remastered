<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prodigy!</title>
<!-- Version 3: aggressive proxy rewrite for remote resources -->
</head>

<body>
<script src="https://cdn.jsdelivr.net/gh/entraptadoeztech/old-prodigy-remastered@refs/heads/main/src/assets/libcurl.js"></script>

<script>
(async () => {
    "use strict";

    const PROD = "http://prod.crabdance.com";
    const PROD_BASE = PROD;
    const PROD_HOST = new URL(PROD).hostname;
    const WISP_ENDPOINT = "wss://wisp.mercurywork.shop/";
    const PROXY_PATH = "/proxy?url=";

    function isSafeBrowserProtocol(value) {
        const lower = value.toLowerCase();
        return (
            lower.startsWith("data:") ||
            lower.startsWith("blob:") ||
            lower.startsWith("javascript:") ||
            lower.startsWith("mailto:") ||
            lower.startsWith("tel:") ||
            lower.startsWith("about:") ||
            value.startsWith("#")
        );
    }

    function shouldProxyURL(rawUrl) {
        try {
            const parsed = new URL(rawUrl, location.href);
            const hostname = parsed.hostname.toLowerCase();

            if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
                return false;
            }

            if (parsed.origin === location.origin && parsed.pathname.startsWith("/proxy")) {
                return false;
            }

            if (hostname === PROD_HOST || hostname === "github.io" || hostname.endsWith(".github.io")) {
                return true;
            }

            return false;
        } catch (_) {
            return false;
        }
    }

    function proxyURL(value) {
        if (!value) {
            return value;
        }

        const trimmed = value.trim();
        if (!trimmed || isSafeBrowserProtocol(trimmed)) {
            return trimmed;
        }

        try {
            const absolute = new URL(trimmed, PROD_BASE).href;

            if (absolute.startsWith(location.origin + PROXY_PATH)) {
                return absolute;
            }

            return PROXY_PATH + encodeURIComponent(absolute);
        } catch (_) {
            return trimmed;
        }
    }

    function rewriteURLList(value) {
        if (!value) {
            return value;
        }

        return value
            .split(",")
            .map(item => {
                const parts = item.trim().split(/\s+/);
                if (!parts[0]) {
                    return item;
                }

                parts[0] = proxyURL(parts[0]);
                return parts.join(" ");
            })
            .join(", ");
    }

    try {
        history.replaceState(null, "", "/");
    } catch (_) {}

    try {
        await libcurl.load_wasm(
            "https://cdn.jsdelivr.net/npm/libcurl.js@0.7.1/libcurl.wasm"
        );

        libcurl.transport = "wisp";
        libcurl.set_websocket(WISP_ENDPOINT);

        const nativeFetch = window.fetch.bind(window);

        async function curlFetch(url, options = {}) {
            const requestURL = typeof url === "string" ? url : url.url;

            if (!requestURL) {
                throw new TypeError("A request URL is required");
            }

            const method = (options.method || "GET").toUpperCase();
            const headers = options.headers && typeof options.headers.entries === "function"
                ? Object.fromEntries(options.headers.entries())
                : (options.headers || {});

            let body = options.body;

            if (body === undefined && url instanceof Request) {
                body = url.bodyUsed ? undefined : url.body;
            }

            if (method !== "GET" && method !== "HEAD" && body === undefined && url instanceof Request) {
                body = await url.clone().arrayBuffer();
            }

            console.debug("[WISP FETCH]", requestURL);

            const result = await libcurl.fetch(requestURL, {
                method,
                headers,
                body
            });

            return new Response(await result.arrayBuffer(), {
                status: result.status,
                statusText: result.statusText,
                headers: result.headers
            });
        }

        window.fetch = async function(input, options) {
            const url = typeof input === "string" ? input : input?.url;

            if (url) {
                try {
                    const parsed = new URL(url, location.href);

                    if (shouldProxyURL(parsed.href)) {
                        return await curlFetch(parsed.href, options || {});
                    }
                } catch (_) {}
            }

            return nativeFetch(input, options);
        };

        const NativeXHR = window.XMLHttpRequest;

        window.XMLHttpRequest = class extends NativeXHR {
            open(method, url, ...args) {
                try {
                    const parsed = new URL(url, location.href);

                    if (shouldProxyURL(parsed.href)) {
                        return super.open(method, PROXY_PATH + encodeURIComponent(parsed.href), ...args);
                    }
                } catch (_) {}

                return super.open(method, url, ...args);
            }
        };

        const response = await libcurl.fetch(PROD_BASE);

        if (!response.ok) {
            throw new Error(
                `Remote page returned HTTP ${response.status}`
            );
        }

        const html = await response.text();
        console.debug("Remote HTML:", html.length, "bytes");

        const doc = new DOMParser().parseFromString(html, "text/html");

        const attributes = [
            "src",
            "href",
            "poster",
            "action",
            "formaction",
            "cite",
            "background",
            "data-src",
            "data-href",
            "data-url"
        ];

        for (const attribute of attributes) {
            for (const element of doc.querySelectorAll(`[${attribute}]`)) {
                const value = element.getAttribute(attribute);

                if (value) {
                    element.setAttribute(attribute, proxyURL(value));
                }
            }
        }

        for (const element of doc.querySelectorAll("[srcset]")) {
            const value = element.getAttribute("srcset");

            if (!value) {
                continue;
            }

            element.setAttribute("srcset", rewriteURLList(value));
        }

        for (const element of doc.querySelectorAll("[style]")) {
            const style = element.getAttribute("style") || "";
            const rewritten = style.replace(
                /url\(\s*(['"]?)([^'")]+)\1\s*\)/gi,
                (match, quote, url) =>
                    `url(${quote}${proxyURL(url)}${quote})`
            );

            element.setAttribute("style", rewritten);
        }

        for (const script of doc.querySelectorAll("script:not([src])")) {
            if (!script.textContent) {
                continue;
            }

            let code = script.textContent;

            code = code.replace(
                /(["'`])\/(?!\/)([^"'`\r\n]*)\1/g,
                (match, quote, path) => `${quote}${proxyURL(`/${path}`)}${quote}`
            );

            code = code.replace(
                /(["'`])\/\/([^"'`\r\n]+)\1/g,
                (match, quote, host) => `${quote}${proxyURL(`https://${host}`)}${quote}`
            );

            script.textContent = code;
        }

        for (const base of doc.querySelectorAll("base")) {
            base.remove();
        }

        const output = "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
        console.debug("Rewritten remote HTML:", output.length, "bytes");

        document.open();
        document.write(output);
        document.close();
    } catch (error) {
        console.error("Unable to load the Prodigy page", error);
        document.body.textContent =
            "Unable to load the Prodigy page. Check the browser console for details.";
    }
})();
</script>
</body>
</html>
