<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prodigy!</title>
<!-- Version 2: hosted the libcurl files on jsDelivr (project made by entraptadoeztech) -->
</head>
<body>
<script src="https://cdn.jsdelivr.net/gh/entraptadoeztech/old-prodigy-remastered@refs/heads/main/src/assets/libcurl.js"></script>
<script>
(async () => {
    const PROD = "https://daboss7173.github.io/oldprodigy/3-15-3/";
    const PROD_BASE = new URL(PROD);
    const TARGET_ORIGIN = PROD_BASE.origin;

    const LIBCURL_WASM =
        "https://cdn.jsdelivr.net/npm/libcurl.js@0.7.1/libcurl.wasm";

    const nativeFetch = window.fetch.bind(window);

    function isTargetURL(value) {
        try {
            return new URL(value, location.href).origin === TARGET_ORIGIN;
        } catch (_) {
            return false;
        }
    }

    function fixURL(value) {
        if (!value) {
            return value;
        }

        value = value.trim();

        if (/^(?:data:|blob:|javascript:|mailto:|tel:|about:|#)/i.test(value)) {
            return value;
        }

        try {
            return new URL(value, PROD_BASE).href;
        } catch (_) {
            return value;
        }
    }

    async function curlFetch(request) {
        const method = request.method.toUpperCase();
        const body = method === "GET" || method === "HEAD"
            ? undefined
            : await request.clone().arrayBuffer();

        console.log("[WISP FETCH]", request.url);

        const result = await libcurl.fetch(request.url, {
            method,
            headers: Object.fromEntries(request.headers),
            body
        });

        return new Response(await result.arrayBuffer(), {
            status: result.status,
            statusText: result.statusText,
            headers: result.headers
        });
    }

    window.fetch = function(input, init = {}) {
        let request;

        try {
            request = input instanceof Request
                ? input
                : new Request(input, init);
        } catch (_) {
            return nativeFetch(input, init);
        }

        if (isTargetURL(request.url)) {
            return curlFetch(request);
        }

        return nativeFetch(input, init);
    };

    try {
        await libcurl.load_wasm(LIBCURL_WASM);

        libcurl.transport = "wisp";
        libcurl.set_websocket("wss://wisp.mercurywork.shop/");

        const response = await libcurl.fetch(PROD);

        if (!response.ok) {
            throw new Error(`Target app returned HTTP ${response.status}`);
        }

        const html = await response.text();
        console.log("Target HTML:", html.length, "bytes");

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");

        const attributes = [
            "src",
            "href",
            "poster",
            "action",
            "formaction",
            "cite",
            "background",
            "data-src",
            "data-href",
            "data-url"
        ];

        for (const attribute of attributes) {
            for (const element of doc.querySelectorAll(`[${attribute}]`)) {
                const value = element.getAttribute(attribute);

                if (value) {
                    element.setAttribute(attribute, fixURL(value));
                }
            }
        }

        for (const element of doc.querySelectorAll("[srcset]")) {
            const value = element.getAttribute("srcset");

            if (!value) {
                continue;
            }

            const rewritten = value
                .split(",")
                .map(item => {
                    const parts = item.trim().split(/\s+/);

                    if (parts[0]) {
                        parts[0] = fixURL(parts[0]);
                    }

                    return parts.join(" ");
                })
                .join(", ");

            element.setAttribute("srcset", rewritten);
        }

        for (const element of doc.querySelectorAll("[style]")) {
            const style = element.getAttribute("style");

            if (style) {
                element.setAttribute(
                    "style",
                    style.replace(
                        /url\(\s*(['"]?)([^'")]+)\1\s*\)/gi,
                        (match, quote, url) => `url(${quote}${fixURL(url)}${quote})`
                    )
                );
            }
        }

        // The original app may construct root-relative asset URLs in inline code.
        // Keep this intentionally limited to quoted root-relative strings.
        for (const script of doc.querySelectorAll("script:not([src])")) {
            if (!script.textContent) {
                continue;
            }

            script.textContent = script.textContent.replace(
                /(["'`])\/(?![/*])([^"'`\r\n]*)\1/g,
                (match, quote, path) => `${quote}${fixURL(`/${path}`)}${quote}`
            );
        }

        for (const base of doc.querySelectorAll("base")) {
            base.remove();
        }

        const output = "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
        console.log("Rewritten app HTML:", output.length, "bytes");

        document.open();
        document.write(output);
        document.close();
    } catch (error) {
        console.error("Failed to load the Prodigy app", error);
        document.body.textContent = "Unable to load the Prodigy app. Check the browser console for details.";
    }
})();
</script>
</body>
</html>
